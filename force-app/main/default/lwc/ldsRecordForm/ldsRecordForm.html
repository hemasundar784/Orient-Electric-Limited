<template>
    <lightning-card icon-name="standard:account" title="Demonstrate lightning-record-form Tag">
        <div class="slds-var-m-around_large slds-box">
            <!-- 
                lightning-record-form:

                This is the MOST AUTO-GENERATED form provided by LDS.
                It can do Create, Edit, and View depending on the mode.
                • mode="view"  → read-only
                • mode="edit"  → editable form
                • mode="readonly" → like detail page

                It automatically:
                ✓ Fetches record
                ✓ Displays fields
                ✓ Handles validation
                ✓ Saves record
                ✓ Shows errors (internally)
            -->
            <lightning-record-form
                object-api-name={objectApiName} record-id={recordId} 
                fields = {fields} density="compact" mode="view"
                onsuccess={handleSuccess} onerror={handleError}
            ></lightning-record-form>
        </div>
    </lightning-card>
</template>
