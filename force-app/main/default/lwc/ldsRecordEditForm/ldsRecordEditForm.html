<template>
    <lightning-card icon-name="standard:account" title="Demonstrate lightning-record-edit-form Tag">
        <div class="slds-var-m-around_large slds-box">
            <!-- 
                lightning-record-edit-form: 
                This tag creates an editable form using Lightning Data Service (LDS).
                It automatically handles:
                 • CRUD operations
                 • Field-Level Security
                 • Required field validation
                 • Error handling
            -->
            <lightning-record-edit-form object-api-name={objectApiName}
                record-id={recordId} density="compact" onsubmit={handleSave}>
                <!-- 
                    Loop over fields array and generate input fields dynamically.
                    Each lightning-input-field is controlled by LDS.
                -->
                <template for:each={fields} for:item="field">
                    <lightning-input-field 
                        key={field} field-name={field}></lightning-input-field>
                </template>
                <!-- Submit button that triggers the form submit -->
                <div class="slds-align_absolute-center slds-p-around_small">
                    <lightning-button variant="brand-outline" 
                        type="submit" label="Save"></lightning-button>
                </div>
            </lightning-record-edit-form>
        </div>
    </lightning-card>
</template>
