<template>
    <lightning-card title="Record Viewer">
        <div class="slds-p-around_medium">
            <template if:true={recordId}>
                <p class="slds-text-title_caps slds-m-bottom_small">
                    {objectApiName} – {recordId}
                </p>
                <lightning-record-view-form
                    record-id={recordId}
                    object-api-name={objectApiName}>
                    <div class="slds-grid slds-wrap">
                        <template for:each={fieldApiNames} for:item="field">
                            <div key={field}
                                 class="slds-col slds-size_1-of-2 slds-p-right_small slds-m-bottom_small">
                                <lightning-output-field field-name={field}></lightning-output-field>
                            </div>
                        </template>
                    </div>
                </lightning-record-view-form>
            </template>
            <template if:false={recordId}>
                <p>Select a record from the list to view its details.</p>
            </template>
        </div>
    </lightning-card>
</template>
